name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    # A newer push supersedes a running gate on the same ref. The event is part of the group so a
    # push never cancels the gate of a manual deploy run.
    concurrency:
      group: gate-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      # Builds the npm package, packs it, installs the tarball into a throwaway HOME and runs it.
      - run: bun run smoke

  deploy:
    # Manual only: Actions, `ci`, Run workflow on main. It deploys the hub of
    # whoever owns this repository's `production` environment, after the gate,
    # and names what is missing instead of deploying a half-configured Worker.
    # Setup is docs/deploy.md, 1.0.
    needs: gate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    # Its own group, never cancelled: a deploy stopped halfway can leave the Worker and its
    # secret out of step. A second dispatch waits for the running one instead.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Check the deploy configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          HUB_DOMAIN: ${{ vars.HUB_DOMAIN }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SYNC_TOKEN HUB_DOMAIN ACCESS_TEAM_DOMAIN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not deployed. Set$missing in the production environment (docs/deploy.md, 1.0)."
            exit 1
          fi
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/worker
          packageManager: bun
          # The custom domain and the Access identity live in repository
          # variables, never in wrangler.jsonc; the action appends each `vars`
          # name as `--var NAME:value` to this command.
          command: deploy --domain ${{ vars.HUB_DOMAIN }}
          vars: |
            ACCESS_TEAM_DOMAIN
            ACCESS_AUD
            HUMAN_EMAIL
            SERVICE_ACTORS
            KABANE_TIMEZONE
          # The log bearer secret is uploaded on every deploy from the GitHub secret.
          secrets: |
            SYNC_TOKEN
        env:
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          HUMAN_EMAIL: ${{ vars.HUMAN_EMAIL }}
          SERVICE_ACTORS: ${{ vars.SERVICE_ACTORS }}
          KABANE_TIMEZONE: ${{ vars.KABANE_TIMEZONE }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
