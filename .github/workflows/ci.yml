name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test

  deploy:
    # The hub Worker deploys from main only, after the gate, and only once the
    # Cloudflare credentials exist as repository secrets. Until then the job
    # reports what is missing instead of failing, so the first pushes stay green.
    needs: gate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - id: creds
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.creds.outputs.ok != 'true'
        run: echo "::notice::Deploy skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the production environment (docs/deploy.md, part 1)."
      - if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/worker
          packageManager: bun
          # Access identity lives in repository variables, never in wrangler.jsonc.
          vars: |
            ACCESS_AUD
            HUMAN_EMAIL
            SERVICE_ACTORS
          # The log bearer secret is uploaded on every deploy from the GitHub secret.
          secrets: |
            SYNC_TOKEN
        env:
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          HUMAN_EMAIL: ${{ vars.HUMAN_EMAIL }}
          SERVICE_ACTORS: ${{ vars.SERVICE_ACTORS }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
