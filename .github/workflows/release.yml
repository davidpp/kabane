name: verified release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish after protected-environment approval (existing vX.Y.Z or vX.Y.Z-beta.N tag ref only)"
        type: boolean
        default: false
      notes:
        description: "Review these public release notes before approving publication"
        type: string
        required: false

permissions:
  contents: read

jobs:
  native-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Compile once with the native OpenTUI dependency and retain archive
        run: bun scripts/build-binary.ts "${{ matrix.target }}" "$RUNNER_TEMP/native"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/native/*.tar.gz
            ${{ runner.temp }}/native/*.json

  prepare:
    needs: native-binaries
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      # Proposed exact official pins; maintainer review is required before a live release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - name: Build and pack the retained artifact once
        run: bun scripts/release.ts prepare "$RUNNER_TEMP/release"
        env:
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RELEASE_NOTES: ${{ inputs.notes }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: ${{ runner.temp }}/native
      - name: Verify producer identities and assemble original bytes with one checksum list
        run: bun scripts/release-binaries.ts "$RUNNER_TEMP/release" "$RUNNER_TEMP/native"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kabane-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/release/*.tgz
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/manifest.json
            ${{ runner.temp }}/release/SHA256SUMS
            ${{ runner.temp }}/release/release-notes.md

  installed-smoke:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: macos-15, target: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - run: bun scripts/release.ts verify "$RUNNER_TEMP/release"
      - name: Install and drive exactly the downloaded archive (no build or pack)
        run: bun scripts/smoke.ts --artifact-dir "$RUNNER_TEMP/release"
      - name: Drive the retained standalone binary without Bun on PATH
        run: |
          mkdir "$RUNNER_TEMP/standalone"
          tar -xzf "$RUNNER_TEMP/release/kabane-${{ matrix.target }}.tar.gz" -C "$RUNNER_TEMP/standalone"
          bun scripts/smoke.ts --binary "$RUNNER_TEMP/standalone/kabane/kabane"

  publish:
    if: inputs.publish && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'davidpp/kabane'
    needs: [prepare, installed-smoke]
    runs-on: ubuntu-24.04
    environment: npm-release
    concurrency:
      group: release-kabane-stable
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - run: bun scripts/release.ts verify "$RUNNER_TEMP/release"
      # No NODE_AUTH_TOKEN/npm secret: OIDC only. Setup confirmation is a human
      # assertion, not proof of environment protection or a trusted-publisher exchange.
      - name: Complete the verified exact-archive publication
        run: bun scripts/release.ts publish "$RUNNER_TEMP/release"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RELEASE_SETUP_CONFIRMED: ${{ vars.RELEASE_SETUP_CONFIRMED }}
