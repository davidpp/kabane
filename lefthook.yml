pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{ts,tsx}"
      run: bunx oxlint {staged_files} && bunx oxlint --type-aware --config .oxlintrc.typed.json {staged_files}

    - name: typecheck
      glob: "*.{ts,tsx,d.ts,d.mts,d.cts}"
      run: bun run typecheck
